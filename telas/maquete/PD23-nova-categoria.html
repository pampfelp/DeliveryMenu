<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>PD23 Nova categoria no computador</title>
<link rel="stylesheet" href="_painel-app.css?v=1">
<style>
  html, body { width: 1440px; }
  .pc { position: relative; width: 1440px; height: 900px; overflow: hidden; }
  .fundo { position: absolute; inset: 0; width: 1440px; height: 900px; border: 0; }
  .veu { position: absolute; inset: 0; background: var(--overlay); }
  .modal { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 440px; display: flex; flex-direction: column; background: var(--surface); border-radius: var(--r-lg); box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); overflow: hidden; }
  .m-cab { display: flex; align-items: center; gap: 12px; padding: 18px 24px; border-bottom: 1px solid var(--border); }
  .m-cab h2 { font: 600 20px/28px Rubik; color: var(--text-strong); }
  .m-cab small { font-size: 13px; color: var(--text-muted); }
  .m-cab .fechar { margin-left: auto; }
  .m-corpo { padding: 20px 24px; }
  .topo-item { display: grid; grid-template-columns: 200px 1fr; gap: 24px; }
  .foto-env { width: 200px; height: 200px; border: 2px dashed #c4c8cf; border-radius: var(--r-md); background: var(--surface-muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; color: var(--text-muted); font-size: 12px; line-height: 16px; padding: 12px; }
  .foto-env svg.ic { width: 28px; height: 28px; stroke-width: 1.4; }
  .foto-env b { font: 500 14px/20px Rubik; color: var(--accent); }
  .campos { display: grid; gap: 12px; }
  .dupla { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .campo label { display: block; font: 500 13px/18px Rubik; color: var(--text-muted); margin-bottom: 6px; }
  .campo label i { color: var(--danger); font-style: normal; }
  .in { height: 42px; border: 1px solid var(--border-input); border-radius: var(--r-md); padding: 0 12px; display: flex; align-items: center; gap: 8px; font-size: 15px; color: var(--text-strong); }
  .in.vazio { color: var(--text-muted); }
  .in small { color: var(--text-muted); font-size: 15px; }
  .in .ic:last-child { margin-left: auto; color: var(--text-muted); }
  .in.area { height: 62px; align-items: flex-start; padding-top: 10px; font-size: 14px; line-height: 20px; }
  .ajuda { margin-top: 4px; font-size: 12px; line-height: 16px; color: var(--text-muted); }
  .linha-op { display: flex; align-items: center; gap: 24px; margin-top: 16px; }
  .chips { display: flex; gap: 6px; }
  .chip-s { height: 32px; padding: 0 12px; display: flex; align-items: center; border: 1px solid var(--border); border-radius: 16px; font: 500 13px/18px Rubik; color: var(--text); }
  .chip-s.on { border-color: var(--accent); background: #fdf2f2; color: var(--accent); }
  .rot { font: 500 13px/18px Rubik; color: var(--text-muted); }
  .marcar { display: flex; align-items: center; gap: 8px; font: 500 14px/20px Rubik; color: var(--text-strong); }
  .caixa-m { width: 20px; height: 20px; border-radius: 4px; background: var(--accent); color: #fff; display: grid; place-items: center; }
  .caixa-m svg.ic { width: 14px; height: 14px; stroke-width: 3; }
  .disp { margin-left: auto; display: flex; align-items: center; gap: 8px; font: 500 14px/20px Rubik; color: var(--text-strong); }
  .disp .trilho { width: 36px; height: 22px; border-radius: 11px; background: var(--success); position: relative; }
  .disp .trilho::after { content: ""; position: absolute; top: 3px; right: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: var(--shadow-sm); }
  .adic { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }
  .adic-cab { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
  .adic-cab b { font: 600 13px/18px Rubik; letter-spacing: .02em; text-transform: uppercase; color: var(--text-muted); }
  .adic-cab small { font-size: 13px; color: var(--text-muted); }
  .grupo-r { display: grid; grid-template-columns: 16px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--r-md); margin-bottom: 8px; }
  .grupo-r > .ic:first-child { color: #b6bbc4; width: 16px; height: 16px; }
  .grupo-r b { font: 500 15px/20px Rubik; color: var(--text-strong); }
  .grupo-r b span { margin-left: 8px; font: 500 11px/14px Rubik; padding: 3px 6px; border-radius: 4px; background: var(--bg); color: var(--text-muted); }
  .grupo-r b span.obr { background: #fffbeb; color: var(--warning); }
  .grupo-r p { margin-top: 2px; font-size: 13px; line-height: 18px; color: var(--text-muted); }
  .grupo-r p em { font-style: normal; color: var(--warning); }
  .grupo-r a { font: 500 14px/20px Rubik; color: var(--accent); }
  .add-grupo { display: inline-flex; align-items: center; gap: 6px; font: 500 14px/20px Rubik; color: var(--accent); margin-top: 2px; }
  .add-grupo svg.ic { width: 18px; height: 18px; }
  .m-pe { display: flex; align-items: center; gap: 12px; padding: 14px 24px; border-top: 1px solid var(--border); }
  .m-pe .excluir { display: flex; align-items: center; gap: 6px; font: 500 14px/20px Rubik; color: var(--danger); }
  .m-pe .excluir svg.ic { width: 18px; height: 18px; }
  .m-pe .btn { width: auto; padding: 0 20px; }
  .m-pe .btn-ghost { margin-left: auto; color: var(--text); }
</style></head>
<body><div class="pc">
  <iframe class="fundo" src="PD20-cardapio.html" tabindex="-1"></iframe>
  <div class="veu"></div>
  <section class="modal">
    <div class="m-cab"><h2>Nova categoria</h2><span class="fechar"><i data-ic="x"></i></span></div>
    <div class="m-corpo">
      <div class="campo"><label>Nome <i>*</i></label><div class="in">Sobremesas</div><p class="ajuda">Aparece como título no cardápio, na ordem da lista de categorias.</p></div>
    </div>
    <div class="m-pe">
      <div class="btn btn-ghost">Cancelar</div>
      <div class="btn btn-accent">Criar categoria</div>
    </div>
  </section>
</div>
<script src="_icones.js?v=3"></script>
</body></html>
