<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>P01 Login do painel</title>
<link rel="stylesheet" href="_painel.css?v=1">
<style>
  .tela { background: var(--bg); }
  .topo-marca { height: 220px; background: var(--accent); padding: 56px 24px 0; }
  .topo-marca p { margin-top: 18px; color: #fff; font: 400 15px/22px Rubik; opacity: .92; max-width: 300px; }
  .form { margin: -40px 16px 0; padding: 24px 20px; background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-raised); }
  .rodape-txt { margin-top: 18px; text-align: center; font-size: 12px; line-height: 16px; color: var(--text-muted); }
</style></head>
<body><div class="tela">
  <div class="topo-marca">
    <div class="marca"><span class="selo-marca"><i data-ic="lista"></i></span><span><b>Cardápio Delivery</b><small>Painel do restaurante</small></span></div>
    <p>Receba os pedidos, cuide do cardápio e das entregas num lugar só.</p>
  </div>

  <div class="form">
    <h1>Entrar</h1>
    <p class="sub">Use o e-mail e a senha do seu cadastro.</p>
    <div class="campo"><label>E-mail</label><div class="in foco"><i data-ic="email"></i><span>dono@restaurante.com</span></div></div>
    <div class="campo"><label>Senha</label><div class="in"><i data-ic="cadeado"></i><span>••••••••</span><i data-ic="olho"></i></div></div>
    <div class="linha-entre">Esqueci minha senha</div>
    <div class="btn btn-accent">Entrar</div>
    <div class="ou">Ainda não tem conta?</div>
    <div class="btn btn-ghost">Cadastrar meu restaurante</div>
  </div>
  <p class="rodape-txt">Cardápio Delivery</p>
</div>
<script src="_icones.js?v=2"></script>
</body></html>
