<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>P23 Categorias no celular</title>
<link rel="stylesheet" href="_painel-app.css?v=1">
<style>
  .tela { background: var(--bg); }
  .topo { position: relative; z-index: 2; }
  .topo .voltar { color: var(--text-strong); display: grid; place-items: center; }
  .rolagem { position: absolute; top: 56px; left: 0; right: 0; bottom: 0; overflow: hidden; }
  .conteudo { padding-bottom: 96px; }
  /* P21b: a mesma tela rolada até o fim */
  .rolada .conteudo { margin-top: var(--rolar, 0); }
  .sec { margin: 12px 12px 0; padding: 14px; background: var(--surface); border-radius: var(--r-md); box-shadow: var(--shadow-card); }
  .sec-t { font: 600 12px/16px Rubik; letter-spacing: .02em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
  .foto-env { height: 150px; border: 2px dashed #c4c8cf; border-radius: var(--r-md); background: var(--surface-muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center; color: var(--text-muted); font-size: 12px; line-height: 16px; }
  .foto-env svg.ic { width: 28px; height: 28px; stroke-width: 1.4; }
  .foto-env b { font: 500 14px/20px Rubik; color: var(--accent); }
  .campo { margin-top: 12px; }
  .campo label { display: block; font: 500 12px/16px Rubik; color: var(--text-muted); margin-bottom: 4px; }
  .campo label i { color: var(--danger); font-style: normal; }
  .in { height: 44px; border: 1px solid var(--border-input); border-radius: var(--r-md); padding: 0 12px; display: flex; align-items: center; gap: 8px; font-size: 15px; color: var(--text-strong); }
  .in.vazio { color: var(--text-muted); }
  .in small { color: var(--text-muted); font-size: 15px; }
  .in .ic:last-child { margin-left: auto; color: var(--text-muted); }
  .in.area { height: 84px; align-items: flex-start; padding-top: 10px; font-size: 14px; line-height: 20px; }
  .ajuda { margin-top: 4px; font-size: 12px; line-height: 16px; color: var(--text-muted); }
  .dupla { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip-s { height: 34px; padding: 0 12px; display: flex; align-items: center; border: 1px solid var(--border); border-radius: 17px; font: 500 13px/18px Rubik; color: var(--text); }
  .chip-s.on { border-color: var(--accent); background: #fdf2f2; color: var(--accent); }
  .marcar { display: flex; align-items: center; gap: 10px; height: 44px; margin-top: 8px; border-top: 1px solid var(--border); font: 500 14px/20px Rubik; color: var(--text-strong); }
  .marcar small { display: block; font: 400 12px/16px Rubik; color: var(--text-muted); }
  .marcar span:not(.caixa-m):not(.trilho) { flex: 1; }
  .caixa-m { width: 20px; height: 20px; border-radius: 4px; background: var(--accent); color: #fff; display: grid; place-items: center; flex: none; }
  .caixa-m svg.ic { width: 14px; height: 14px; stroke-width: 3; }
  .trilho { width: 36px; height: 22px; border-radius: 11px; background: var(--success); position: relative; flex: none; }
  .trilho::after { content: ""; position: absolute; top: 3px; right: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: var(--shadow-sm); }
  .grupo-r { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--border); }
  .grupo-r:first-of-type { border-top: 0; }
  .grupo-r div { flex: 1; min-width: 0; }
  .grupo-r b { font: 500 15px/20px Rubik; color: var(--text-strong); }
  .grupo-r b span { margin-left: 6px; font: 500 11px/14px Rubik; padding: 2px 6px; border-radius: 4px; background: var(--bg); color: var(--text-muted); }
  .grupo-r b span.obr { background: #fffbeb; color: var(--warning); }
  .grupo-r p { margin-top: 2px; font-size: 13px; line-height: 18px; color: var(--text-muted); }
  .grupo-r p em { font-style: normal; color: var(--warning); }
  .grupo-r > .ic { color: var(--accent); }
  .add { display: flex; align-items: center; gap: 6px; margin-top: 6px; font: 500 14px/20px Rubik; color: var(--accent); }
  .add svg.ic { width: 18px; height: 18px; }
  .excluir { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 20px 12px 0; height: 44px; font: 500 14px/20px Rubik; color: var(--danger); }
  .excluir svg.ic { width: 18px; height: 18px; }
  .rodape { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; padding: 12px 16px 20px; background: var(--surface); box-shadow: var(--shadow-bar); }
  .cat { display: flex; align-items: center; gap: 10px; height: 52px; border-top: 1px solid var(--border); font: 500 15px/20px Rubik; color: var(--text-strong); }
  .cat:first-of-type { border-top: 0; }
  .cat > .ic:first-child { color: #b6bbc4; width: 18px; height: 18px; }
  .cat > span:not(.acao) { flex: 1; }
  .cat small { font: 400 13px/18px Rubik; color: var(--text-muted); margin-right: 4px; }
  .cat .acao { width: 32px; height: 32px; display: grid; place-items: center; color: var(--text-muted); }
  .cat .acao svg.ic { width: 18px; height: 18px; }
  .nota-c { margin: 12px 16px 0; font-size: 12px; line-height: 16px; color: var(--text-muted); }
</style></head>
<body><div class="tela">
  <div class="topo"><span class="voltar"><i data-ic="esquerda"></i></span><h1>Categorias</h1></div>
  <div class="rolagem"><div class="conteudo">
    <div class="sec">
      <div class="sec-t">Arraste para mudar a ordem</div>
      <div class="cat"><i data-ic="arrastar"></i><span>Burgers</span><small>5 itens</small><span class="acao"><i data-ic="editar"></i></span><span class="acao"><i data-ic="lixo"></i></span></div>
      <div class="cat"><i data-ic="arrastar"></i><span>Pizzas</span><small>1 item</small><span class="acao"><i data-ic="editar"></i></span><span class="acao"><i data-ic="lixo"></i></span></div>
      <div class="cat"><i data-ic="arrastar"></i><span>Acompanhamentos e bebidas</span><small>3 itens</small><span class="acao"><i data-ic="editar"></i></span><span class="acao"><i data-ic="lixo"></i></span></div>
    </div>
    <p class="nota-c">Só dá para excluir categoria vazia. Mude os itens de categoria antes.</p>
    <div class="sec">
      <div class="campo" style="margin-top:0"><label>Nova categoria</label><div class="in vazio">Ex.: Sobremesas</div></div>
    </div>
  </div></div>
  <div class="rodape"><div class="btn btn-accent">Criar categoria</div></div>
</div>
<script src="_icones.js?v=3"></script>
</body></html>
