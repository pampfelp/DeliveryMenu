<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Esqueleto CRM — Casa Jambu</title><link rel="stylesheet" href="../../tokens.css?v=1"><link rel="stylesheet" href="../../clientes.css?v=1"><style>@font-face{font-family:Rubik;src:url('../../fontes/rubik-latin.woff2?v=1')}*{box-sizing:border-box}body{margin:0;background:#f5f5f5;font-family:Rubik,Arial,sans-serif;color:#333}button,input{font:inherit}button{background:none;border:0;cursor:pointer}aside{width:240px;position:fixed;inset:0 auto 0 0;background:#e5e5e5;padding:24px;border-right:1px dashed #777}aside b{display:block;font-size:20px}aside a{display:block;padding:16px 8px;color:#333;text-decoration:none}aside a.ativa{outline:1px dashed #777}main{margin-left:240px}.aviso{padding:10px 28px;background:#ddd;font-size:12px}.nav{display:none}@media(max-width:1023px){aside{display:none}main{margin-left:0}.nav{display:flex;position:fixed;bottom:0;left:0;right:0;justify-content:space-around;background:#ddd;padding:18px 0;font-size:10px}.aviso{padding:8px 16px}}</style><aside><b>Cardápio Delivery</b><small>Painel do restaurante</small><a>Pedidos</a><a>Cardápio</a><a class="ativa">Clientes</a><a>Entregas e bairros</a><a>Cupons</a><a>Configurações</a></aside><main><div class="aviso">Esqueleto para revisão de estrutura. Dados de exemplo. Aparência final será aplicada por camadas.</div><section class="crm-lista" id="crm"></section></main><nav class="nav">Pedidos · Cardápio · Clientes · Entregas · Cupons · Ajustes</nav><div class="crm-modal" id="crm-modal" hidden><section class="crm-oferta" role="dialog" aria-modal="true" aria-labelledby="crm-oferta-titulo" id="crm-oferta"></section></div><script type="module">
import{htmlClientes,htmlOferta}from'../../clientes-vista.js?v=1';
const clientes=[{nome:'Ana Costa',telefone:'91900001023',noMes:true,concluidos:12,media:8990,ultimo:{total:9600,data:'18/10/2026'},favoritos:{pizza:'Calabresa grande',acompanhamento:'Batata média',bebida:'Coca-Cola 2 L'}},{nome:'Bruno Lima',telefone:'91900004089',noMes:false,concluidos:4,media:6450,ultimo:{total:6900,data:'29/09/2026'},favoritos:{pizza:'Mussarela média',bebida:'Guaraná 1 L'}},{nome:'Carla Souza',telefone:'91900002024',noMes:true,concluidos:8,media:10900,ultimo:{total:11200,data:'17/10/2026'},favoritos:{pizza:'Jambu Amazônico grande',acompanhamento:'Batata média',bebida:'Guaraná 2 L'}}];

document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelector('#crm-modal').hidden=true});
</script></html>
