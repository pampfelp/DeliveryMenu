<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>D16 Pedido enviado no computador</title>
<link rel="stylesheet" href="_pc.css?v=1">
<style>
  .cartao-ok { width: 560px; margin: 40px auto 0; padding: 32px 32px 24px; }
  .ok { width: 88px; height: 88px; margin: 0 auto; border-radius: 50%; background: var(--success-bg); color: var(--success); display: grid; place-items: center; }
  .ok svg.ic { width: 44px; height: 44px; stroke-width: 2.4; }
  h1.t { margin-top: 16px; text-align: center; font: 600 24px/32px Rubik; color: var(--text-strong); }
  p.s { margin-top: 6px; text-align: center; font-size: 15px; line-height: 22px; color: var(--text-muted); }
  .num { margin-top: 22px; padding: 14px; border: 1px solid var(--border); border-radius: var(--r-md); display: flex; justify-content: space-between; align-items: center; }
  .num small { display: block; font-size: 12px; line-height: 16px; color: var(--text-muted); }
  .num b { font: 600 18px/24px Rubik; color: var(--text-strong); }
  .num .prazo { text-align: right; }
  .passos { margin-top: 14px; padding: 14px; border: 1px solid var(--border); border-radius: var(--r-md); }
  .p { display: flex; gap: 12px; position: relative; padding-bottom: 16px; }
  .p:last-child { padding-bottom: 0; }
  .p::before { content: ""; position: absolute; left: 11px; top: 24px; bottom: 0; width: 2px; background: var(--border); }
  .p:last-child::before { display: none; }
  .b { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--border); background: var(--surface); flex: none; display: grid; place-items: center; position: relative; }
  .b.feito { background: var(--success); border-color: var(--success); color: #fff; }
  .b.feito svg.ic { width: 14px; height: 14px; stroke-width: 3; }
  .b.atual { border-color: var(--accent); }
  .b.atual::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  .p div { font: 500 14px/24px Rubik; color: var(--text-strong); }
  .p div small { display: block; font: 400 12px/16px Rubik; color: var(--text-muted); }
  .p.depois div { color: var(--text-muted); }
  .acoes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
  .btn-ghost svg.ic { color: var(--success); }
</style></head>
<body><div class="pc">
  <div class="faixa-fina"><div class="dentro"><span class="mini foto">LOGO</span>Nome do Restaurante</div></div>
  <div class="cartao-ok cartao">
    <div class="ok"><i data-ic="check"></i></div>
    <h1 class="t">Pedido enviado!</h1>
    <p class="s">O restaurante já recebeu seu pedido e vai começar a preparar.</p>
    <div class="num"><div><small>Pedido</small><b>#1048</b></div><div class="prazo"><small>Previsão de entrega</small><b>19h40 - 19h50</b></div></div>
    <div class="passos">
      <div class="p"><span class="b feito"><i data-ic="check"></i></span><div>Pedido recebido<small>19h05</small></div></div>
      <div class="p"><span class="b atual"></span><div>Em preparo<small>Aguardando o restaurante confirmar</small></div></div>
      <div class="p depois"><span class="b"></span><div>Saiu para entrega</div></div>
      <div class="p depois"><span class="b"></span><div>Entregue</div></div>
    </div>
    <div class="acoes">
      <div class="btn btn-ghost"><i data-ic="conversa"></i>Falar com o restaurante</div>
      <div class="btn btn-accent">Acompanhar pedido</div>
    </div>
  </div>
</div>
<script src="_icones.js?v=1"></script>
</body></html>
